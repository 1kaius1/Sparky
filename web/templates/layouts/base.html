{{define "base"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} - Sparky</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <script src="/static/js/htmx.min.js"></script>
  <script src="/static/js/chart.umd.min.js"></script>
  <script src="/static/js/metrics.js"></script>
  <script src="/static/js/sse.js"></script>
</head>
<body>
  <div class="layout">
    <nav class="sidebar">
      <div class="sidebar-brand">Sparky</div>
      <ul class="sidebar-nav">
        <li>
          <a href="/dashboard" hx-get="/dashboard" hx-target="#main-content" hx-push-url="true"
             class="{{if eq .ActiveSection "dashboard"}}active{{end}}">Dashboard</a>
        </li>
        <li>
          <a href="/nodes" hx-get="/nodes" hx-target="#main-content" hx-push-url="true"
             class="{{if eq .ActiveSection "nodes"}}active{{end}}">Nodes</a>
        </li>
        <li>
          <a href="/profiles" hx-get="/profiles" hx-target="#main-content" hx-push-url="true"
             class="{{if eq .ActiveSection "profiles"}}active{{end}}">Model profiles</a>
        </li>
        <li>
          <a href="/transfers" hx-get="/transfers" hx-target="#main-content" hx-push-url="true"
             class="{{if eq .ActiveSection "transfers"}}active{{end}}">Transfers</a>
        </li>
        <li>
          <a href="/metrics" hx-get="/metrics" hx-target="#main-content" hx-push-url="true"
             class="{{if eq .ActiveSection "metrics"}}active{{end}}">Metrics</a>
        </li>
        <li>
          <a href="/users" hx-get="/users" hx-target="#main-content" hx-push-url="true"
             class="{{if eq .ActiveSection "users"}}active{{end}}">Users &amp; permissions</a>
        </li>
        <li>
          <a href="/audit-log" hx-get="/audit-log" hx-target="#main-content" hx-push-url="true"
             class="{{if eq .ActiveSection "audit"}}active{{end}}">Audit log</a>
        </li>
        <li>
          <a href="/settings" hx-get="/settings" hx-target="#main-content" hx-push-url="true"
             class="{{if eq .ActiveSection "settings"}}active{{end}}">Settings</a>
        </li>
      </ul>
      <div class="sidebar-footer">
        <a class="logout-link" hx-post="/logout" hx-swap="none">Logout</a>
      </div>
    </nav>
    <main id="main-content" class="main">
      {{template "content" .}}
    </main>
  </div>
</body>
</html>
{{end}}
