{{define "content"}}
<h1>Users &amp; permissions</h1>

<table class="data-table">
  <thead>
    <tr>
      <th>Display name</th>
      <th>Tier</th>
      <th>Last login</th>
      <th>Elevated by</th>
      <th>Elevated at</th>
      <th>Change tier</th>
    </tr>
  </thead>
  <tbody>
    {{range .Data.Users}}
    <tr>
      <td>{{.DisplayName}}</td>
      <td>{{.Tier}}</td>
      <td>{{.LastLoginAt}}</td>
      <td>{{.ElevatedBy}}</td>
      <td>{{.ElevatedAt}}</td>
      <td>
        {{if .ReachableTiers}}
        <form hx-post="/users/{{.ID}}/tier" hx-swap="none">
          <select name="tier">
            {{range .ReachableTiers}}<option value="{{.}}">{{.}}</option>{{end}}
          </select>
          <button type="submit">Change</button>
        </form>
        {{end}}
      </td>
    </tr>
    {{else}}
    <tr><td colspan="6" class="empty">No users yet.</td></tr>
    {{end}}
  </tbody>
</table>
{{end}}
